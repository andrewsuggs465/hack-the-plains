# Questions show in the order written.
- q: "Do I need a team?"
  a: "No. Teams of up to six can form before the event or at registration. If you don't list a preference, we'll place you on a team based on year and major."
- q: "What do I need to do before the event?"
  a: "Complete the pre-registration form and the Makerspace Basic Safety Training. You can't compete without the training."
- q: "How much does it cost?"
  a: "TBD"
- q: "Do I need hardware experience?"
  a: "No. We balance teams by major and experience, so you'll be working alongside people with different skills."
- q: "Is food provided?"
  a: "Yes. We provide dinner Friday; breakfast, lunch, and dinner Saturday; and breakfast Sunday."
- q: "Can I work overnight?"
  a: "Yes. Teams may work around the clock Friday to Sunday, but physical work only happens during Makerspace hours."
- q: "Can I use AI?"
  a: "Not during brainstorming. Once the build phase starts, AI is allowed for software. See the participant guide for details."
- q: "What should I bring?"
  a: "Your laptop, charger, Makerspace badge, and safety glasses. We provide the tools and hardware."
- q: "Who do I contact with questions?"
  a: "Email aumeshclub@outlook.com."